        <script type="module">
            import * as bootstrap from 'bootstrap';
            window.bootstrap = bootstrap;

            const drawerEl = document.getElementById('navbarNavMenu');
            if (drawerEl) {
                bootstrap.Drawer.getOrCreateInstance(drawerEl);
            }
            const togglerBtn = document.querySelector('.navbar-toggler');
            if (togglerBtn && drawerEl) {
                togglerBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    const drawerInst = bootstrap.Drawer.getOrCreateInstance(drawerEl);
                    if (drawerEl.hasAttribute('open') || drawerEl.classList.contains('show')) {
                        drawerInst.hide();
                    } else {
                        drawerInst.show();
                    }
                });
            }
        </script>
